name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Type check
        run: uv run ty check
      - name: Test
        run: uv run pytest tests/ -v
      - name: Build package
        run: uv build
      - name: Check wheel contents
        run: |
          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" | grep -q "sherlock_second_brain/schema/case.schema.json"
          unzip -l "$wheel" | grep -q "sherlock_second_brain/adapters/templates/fiche.md.j2"
          unzip -l "$wheel" | grep -q "sherlock_second_brain/adapters/templates/skill.md.j2"
