[project]
name = "second-brain"
version = "0.1.0"
description = "MCP server for a second brain: investigation cases promoted into validated fiches and skills, with a local vector index."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.23.0",
    "jinja2>=3.1.6",
    "chromadb>=0.5.0",
    "fastembed>=0.3.0",
]

[project.scripts]
second-brain-mcp = "second_brain.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ANN", "PYI"]
ignore = ["E501"]
preview = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.environment]
root = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.15",
    "ty>=0.0.69",
]
