[project]
name = "sherlock-second-brain"
version = "0.1.0"
description = "Sherlock's second brain : MCP server où chaque case est un dossier d'enquête, promu en fiche ou skill validé une fois résolu (avec index vectoriel local)."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.23.0",
    "jinja2>=3.1.6",
    "chromadb>=0.5.0",
    "fastembed>=0.3.0",
]

[project.scripts]
sherlock-second-brain-mcp = "sherlock_second_brain.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlock_second_brain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ANN", "PYI"]
ignore = ["E501"]
preview = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.environment]
root = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.15",
    "ty>=0.0.69",
]
